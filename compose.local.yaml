# Local run for development: the app plus a throwaway PostgreSQL, bound to 127.0.0.1 only.
# Started by run-local.cmd (builds the jar first). Not used by the pipeline or by prod.
name: pingpong-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pingpong
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pingpong"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pingpong
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:4822:8080"
